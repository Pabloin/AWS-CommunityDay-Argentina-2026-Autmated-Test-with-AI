<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLens v05 Admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <span>StockLens v05</span>
          <h1>Catalogo cloud</h1>
        </div>
        <button id="refresh" type="button">Actualizar</button>
      </header>

      <section class="summary" aria-label="Resumen">
        <article>
          <strong id="total">0</strong>
          <span>objetos</span>
        </article>
        <article>
          <strong id="photos">0</strong>
          <span>fotos</span>
        </article>
        <article>
          <strong id="ready">0</strong>
          <span>con QR</span>
        </article>
      </section>

      <section class="toolbar">
        <input id="search" placeholder="Buscar por nombre, categoria, ubicacion o tag" />
        <select id="status">
          <option value="">Todos</option>
          <option value="review">Para revisar</option>
          <option value="identified">Identificado</option>
          <option value="labeled">Con QR</option>
          <option value="stored">Guardado</option>
          <option value="missing">No ubicado</option>
        </select>
      </section>

      <section id="message" class="message">Cargando catalogo...</section>
      <section id="grid" class="grid" aria-label="Objetos catalogados"></section>
    </main>

    <script src="./config.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
