<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLens · Web</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="StockLens Web">
          <img class="brand-logo" src="https://mobile-v5.lens.glaciar.org/assets/stocklens-logo-BgsHR8IR.png" alt="StockLens" />
          <span class="brand-divider" aria-hidden="true"></span>
          <small>WEB · INVENTARIO</small>
        </a>
        <div class="topbar-actions">
          <span class="sync-state"><i></i> Catálogo cloud</span>
          <button id="refresh" type="button">Actualizar</button>
        </div>
      </header>

      <section class="hero" aria-label="Resumen del inventario">
        <div class="hero-copy">
          <span>Centro de control</span>
          <h1>Todo lo que guardaste,<br />a la vista.</h1>
          <p>Revisá el inventario, abrí cada ficha y compartí su QR desde un solo lugar.</p>
        </div>
        <div class="summary">
          <article><strong id="total">0</strong><span>objetos</span></article>
          <article><strong id="photos">0</strong><span>fotos</span></article>
          <article><strong id="ready">0</strong><span>con QR</span></article>
        </div>
      </section>

      <section class="catalog-header">
        <div>
          <span>Inventario</span>
          <h2>Objetos catalogados</h2>
        </div>
        <p id="result-count">Cargando objetos…</p>
      </section>

      <section class="toolbar" aria-label="Filtrar inventario">
        <label class="search-field">
          <span aria-hidden="true">⌕</span>
          <input id="search" placeholder="Buscar por nombre, ubicación o categoría" />
        </label>
        <select id="status" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
          <option value="review">Para revisar</option>
          <option value="identified">Identificado</option>
          <option value="labeled">Con QR</option>
          <option value="stored">Guardado</option>
          <option value="missing">No ubicado</option>
        </select>
      </section>

      <section id="message" class="message">Cargando catálogo cloud…</section>

      <section class="workspace" aria-label="Catálogo y ficha de objeto">
        <section id="grid" class="grid" aria-label="Objetos catalogados"></section>
        <aside id="detail" class="detail" aria-live="polite"></aside>
      </section>
    </main>

    <script src="./config.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
