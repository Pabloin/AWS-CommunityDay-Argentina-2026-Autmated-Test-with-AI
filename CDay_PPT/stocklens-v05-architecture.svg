<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1727"/>
      <stop offset="1" stop-color="#111e31"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1d7cff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#1d7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="awsBoundary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12253d" stop-opacity=".94"/>
      <stop offset="1" stop-color="#0b1728" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182b44"/>
      <stop offset="1" stop-color="#102038"/>
    </linearGradient>
    <linearGradient id="aiCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28304f"/>
      <stop offset="1" stop-color="#171d38"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#90a5bf" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000814" flood-opacity=".34"/>
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000814" flood-opacity=".27"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#75bfff"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7890aa"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { fill:#79bfff; font-size:18px; font-weight:700; letter-spacing:3px; }
      .title { fill:#f7fbff; font-size:42px; font-weight:700; }
      .subtitle { fill:#a9bdd2; font-size:21px; }
      .zone { fill:#7fc4ff; font-size:17px; font-weight:700; letter-spacing:2px; }
      .name { fill:#f6fbff; font-size:19px; font-weight:700; }
      .detail { fill:#a9bdd2; font-size:15px; }
      .micro { fill:#8098b1; font-size:13px; }
      .flow { fill:#99cfff; font-size:13px; font-weight:700; letter-spacing:.4px; }
      .card { fill:url(#card); stroke:#284361; stroke-width:1.5; }
      .card-ai { fill:url(#aiCard); stroke:#7255a7; stroke-width:1.5; }
      .edge { stroke:#75bfff; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .edge-muted { stroke:#7890aa; stroke-width:2.3; fill:none; marker-end:url(#arrowMuted); }
      .edge-dashed { stroke:#7890aa; stroke-width:2; fill:none; stroke-dasharray:8 9; marker-end:url(#arrowMuted); }
    </style>
