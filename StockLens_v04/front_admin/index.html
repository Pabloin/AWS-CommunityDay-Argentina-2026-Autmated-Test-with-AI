<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="StockLens v04 Playwright Evidence Center."
    />
    <title>StockLens v04 Evidence</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <span class="eyebrow">StockLens v04</span>
          <h1>Playwright Evidence</h1>
        </div>
        <a class="pill-link" href="https://stock-v4.lens.glaciar.org">Abrir app</a>
      </header>

      <section class="summary-grid" aria-label="Resumen">
        <div>
          <span>Runs</span>
          <strong id="runCount">0</strong>
        </div>
        <div>
          <span>Ultimo estado</span>
          <strong id="lastStatus">-</strong>
        </div>
        <div>
          <span>Videos</span>
          <strong id="videoCount">0</strong>
        </div>
      </section>

      <section class="workspace">
        <aside class="runs-panel">
          <div class="panel-head">
            <h2>Runs</h2>
            <button id="refreshButton" type="button">Actualizar</button>
          </div>
          <div id="runsList" class="runs-list"></div>
        </aside>

        <section class="detail-panel" aria-live="polite">
          <div id="emptyState" class="empty-state">
            <h2>Sin evidencia publicada</h2>
            <p>Cuando corra el pipeline de aplicacion, los videos apareceran aca.</p>
          </div>

          <article id="runDetail" class="run-detail" hidden>
            <div class="panel-head">
              <div>
                <span id="detailStatus" class="status-pill">-</span>
                <h2 id="detailTitle">Run</h2>
                <p id="detailMeta"></p>
              </div>
              <a id="githubRunLink" class="pill-link" href="#" target="_blank" rel="noreferrer">
                GitHub Actions
              </a>
            </div>

            <div id="videoGrid" class="video-grid"></div>
            <div id="linksGrid" class="links-grid"></div>
          </article>
        </section>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
