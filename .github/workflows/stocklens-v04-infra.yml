name: StockLens v04 Infrastructure

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply Terraform changes"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  pull_request:
    paths:
      - "StockLens_v04/terraform/**"
      - ".github/workflows/stocklens-v04-infra.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: StockLens_v04/terraform
  TF_VAR_github_owner: pabloin
  TF_VAR_github_repo: AWS-CommunityDay-Argentina-2026-Autmated-Test-with-AI
  TF_VAR_repository_url: git@github-Pabloin:Pabloin/AWS-CommunityDay-Argentina-2026-Autmated-Test-with-AI.git
  TF_VAR_github_oidc_provider_arn: arn:aws:iam::442809140287:oidc-provider/token.actions.githubusercontent.com

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STOCKLENS_V04_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare Lambda package input
        run: |
          cd ..
          ./scripts/build-all.sh

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl.example

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply == 'true'
        run: terraform apply -auto-approve tfplan

      - name: Terraform outputs
        if: github.event_name == 'workflow_dispatch' && inputs.apply == 'true'
        run: terraform output
