name: StockLens v05 Application

on:
  workflow_dispatch:
    inputs:
      run_bedrock_integration:
        description: "Run the non-deterministic Bedrock integration contract"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  workflow_run:
    workflows: ["StockLens v05 Staging Application"]
    types: [completed]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: stocklens-v05
  MOBILE_DOMAIN_NAME: mobile-v5.lens.glaciar.org
  ADMIN_DOMAIN_NAME: web-v5.lens.glaciar.org

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run Layer 02 unit tests
        run: ./StockLens_v05/testing/layer-02-unit/run.sh

  build-and-deploy:
    needs: unit-tests
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event != 'push' ||
        !contains(github.event.workflow_run.head_commit.message, '[infra-first]')))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StockLens_v05
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check AWS app role secret
        env:
          ROLE_ARN: ${{ secrets.STOCKLENS_V05_APP_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error title=Missing secret::Configure STOCKLENS_V05_APP_ROLE_ARN with the github_actions_app_role_arn Terraform output."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.STOCKLENS_V05_APP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: stocklens-v05-app
          allowed-account-ids: "442809140287"

      - name: Build mobile app
        run: |
          api_endpoint="$(aws apigatewayv2 get-apis --query "Items[?Name=='${PROJECT_NAME}-http-api'].ApiEndpoint | [0]" --output text)"
          if [ -z "$api_endpoint" ] || [ "$api_endpoint" = "None" ]; then
            echo "::error title=Missing API::Run StockLens v05 Infrastructure with apply=true before deploying the app."
            exit 1
          fi
          npm ci --prefix front_mobile --include=optional
          npm rebuild --prefix front_mobile esbuild
          VITE_API_BASE_URL="$api_endpoint" VITE_PUBLIC_APP_URL="https://${MOBILE_DOMAIN_NAME}" npm --prefix front_mobile run build
          npm ci --prefix backend
          npm --prefix backend run package

      - name: Resolve AWS resources
        id: resources
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          mobile_bucket="${PROJECT_NAME}-front-mobile-${account_id}"
          admin_bucket="${PROJECT_NAME}-front-admin-${account_id}"
          mobile_distribution_id="${{ vars.STOCKLENS_V05_FRONT_MOBILE_DISTRIBUTION_ID }}"
          admin_distribution_id="${{ vars.STOCKLENS_V05_FRONT_ADMIN_DISTRIBUTION_ID }}"
          if [ -z "$mobile_distribution_id" ]; then
            mobile_distribution_id="$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Quantity > \`0\` && contains(Aliases.Items, '${MOBILE_DOMAIN_NAME}')].Id | [0]" --output text)"
          fi
          if [ -z "$admin_distribution_id" ]; then
            admin_distribution_id="$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Quantity > \`0\` && contains(Aliases.Items, '${ADMIN_DOMAIN_NAME}')].Id | [0]" --output text)"
          fi
          if [ -z "$mobile_distribution_id" ] || [ "$mobile_distribution_id" = "None" ]; then
            echo "::error title=Missing mobile CloudFront::Run StockLens v05 Infrastructure before deploying the app."
            exit 1
          fi
          if [ -z "$admin_distribution_id" ] || [ "$admin_distribution_id" = "None" ]; then
            echo "::error title=Missing admin CloudFront::Run StockLens v05 Infrastructure before deploying the app."
            exit 1
          fi
          echo "mobile_bucket=$mobile_bucket" >> "$GITHUB_OUTPUT"
          echo "admin_bucket=$admin_bucket" >> "$GITHUB_OUTPUT"
          echo "mobile_distribution_id=$mobile_distribution_id" >> "$GITHUB_OUTPUT"
          echo "admin_distribution_id=$admin_distribution_id" >> "$GITHUB_OUTPUT"

      - name: Deploy mobile app
        run: aws s3 sync front_mobile/dist "s3://${{ steps.resources.outputs.mobile_bucket }}" --delete

      - name: Deploy web app
        run: |
          api_endpoint="$(aws apigatewayv2 get-apis --query "Items[?Name=='${PROJECT_NAME}-http-api'].ApiEndpoint | [0]" --output text)"
          printf 'window.STOCKLENS_API_BASE_URL = "%s";\nwindow.STOCKLENS_MOBILE_APP_URL = "https://%s";\n' "$api_endpoint" "$MOBILE_DOMAIN_NAME" > front_web/config.js
          aws s3 sync front_web "s3://${{ steps.resources.outputs.admin_bucket }}" --delete

      - name: Deploy API Lambda
        run: |
          aws lambda update-function-code --function-name "${PROJECT_NAME}-api" --zip-file fileb://backend/dist/api.zip
          aws lambda wait function-updated-v2 --function-name "${PROJECT_NAME}-api"

      - name: Run Layer 03 API integration
        env:
          RUN_BEDROCK_TEST: ${{ inputs.run_bedrock_integration || 'false' }}
          REPORT_DIR: ${{ runner.temp }}/stocklens-v05-layer-03
        run: |
          api_endpoint="$(aws apigatewayv2 get-apis --query "Items[?Name=='${PROJECT_NAME}-http-api'].ApiEndpoint | [0]" --output text)"
          API_BASE_URL="$api_endpoint" ./testing/layer-03-api-integration/run.sh

      - name: Publish Layer 03 report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stocklens-v05-layer-03-${{ github.run_id }}
          path: ${{ runner.temp }}/stocklens-v05-layer-03
          if-no-files-found: warn
          retention-days: 14

      - name: Invalidate mobile CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.resources.outputs.mobile_distribution_id }}" --paths "/*"

      - name: Invalidate admin CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.resources.outputs.admin_distribution_id }}" --paths "/*"
